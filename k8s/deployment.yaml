apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cicd-web-app
  template:
    metadata:
      labels:
        app: cicd-web-app
    spec:
      containers:
        - name: cicd-web-app
          image: cicd-web-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
